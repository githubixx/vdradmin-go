name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check standalone dependency readiness
        run: sh scripts/check-release-readiness.sh

      - name: Go test
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...
